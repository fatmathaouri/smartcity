<div class="change-password-container">
  <mat-card class="change-password-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>lock</mat-icon>
        Modification du mot de passe temporaire
      </mat-card-title>
      <mat-card-subtitle>
        Vous devez changer votre mot de passe avant de continuer.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="error" class="alert alert-error">
        <mat-icon>error</mat-icon> {{ error }}
      </div>
      <div *ngIf="success" class="alert alert-success">
        <mat-icon>check_circle</mat-icon> {{ success }}
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Ancien mot de passe</mat-label>
        <input matInput [(ngModel)]="request.oldPassword" type="password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nouveau mot de passe</mat-label>
        <input matInput [(ngModel)]="request.newPassword" type="password" />
        <mat-icon matSuffix>lock_open</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmer le mot de passe</mat-label>
        <input matInput [(ngModel)]="confirmPassword" type="password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="changePassword()" class="full-width">
        <mat-icon>save</mat-icon> Changer le mot de passe
      </button>
    </mat-card-actions>
  </mat-card>
</div>
