name: cicd

on:
  push:
    branches:
      - workflow
  pull_request:
    branches:
      - workflow

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: smartcity
        run: bash mvnw test --batch-mode

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

      - name: Push Docker Compose images
        run: docker compose push backend frontend