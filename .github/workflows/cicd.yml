name: cicd

on:
  push:
    branches:
      - workflow
  pull_request:
    branches:
      - workflow

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartcity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: smartcity
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/smartcity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: bash mvnw verify --batch-mode

      - name: Analyse SonarQube backend
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: smartcity
        run: >-
          bash mvnw sonar:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.projectKey=smartcity-backend
          -Dsonar.projectName="SmartCity Backend"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=false

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Analyse SonarQube frontend
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.projectKey=smartcity-frontend
            -Dsonar.projectName="SmartCity Frontend"
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code source
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

      - name: Push Docker Compose images
        run: docker compose push backend frontend