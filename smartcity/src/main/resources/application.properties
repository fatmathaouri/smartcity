spring.application.name=smartcity

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/smartcity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

### JWT ###
app.jwt.secret=smartcitySecretKeyThatMustBeAtLeast256BitsLongForHS256Algorithm2024SmartCity
app.jwt.expiration=86400000

### FILE UPLOAD ###
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

### SERVER ###
server.servlet.context-path=/api
server.port=8081

### LOGGING ###
logging.level.root=INFO
logging.level.tn.esprit.spring=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{60} - %msg %n
logging.pattern.file=%msg %n
logging.file.name=c:/log/spring_file.log
logging.logback.rollingpolicy.max-file-size=100KB

### ADMIN LIMITS ###
app.limits.agents-per-department=10
app.limits.max-admins=2
app.limits.max-municipality=3
app.limits.max-managers=8
app.limits.max-agents-total=40
