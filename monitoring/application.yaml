apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "91.6.0"
      helm:
        values: |
          alertmanager:
            enabled: false
          grafana:
            adminPassword: GrafanaLab2026
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 512Mi
            persistence:
              enabled: true
              storageClassName: local-path
              size: 512Mi
            ini:
              plugins:
                autoInstallApps: false
          prometheus:
            prometheusSpec:
              retention: 5d
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-path
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 5Gi
            additionalServiceMonitors:
              - name: ingress-nginx-metrics
                namespaceSelector:
                  matchNames:
                    - ingress-nginx
                selector:
                  matchLabels:
                    app: ingress-nginx-metrics
                endpoints:
                  - port: metrics
                    interval: 30s
          kubeEtcd:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
    - repoURL: https://github.com/fatmathaouri/smartcity.git
      targetRevision: master
      path: monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
