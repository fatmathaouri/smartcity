apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartcity
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fatmathaouri/smartcity.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: smartcity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
